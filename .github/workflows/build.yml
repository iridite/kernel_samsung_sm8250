name: Build CI

on:
  push:
    branches: [ "droidian", "samsung-base", "ianmacd-base" ]
  pull_request:
    branches: [ "droidian", "samsung-base", "ianmacd-base" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Make output dir
      run: mkdir -pv /tmp/results
    - name: Fetch clang+LLVM 10.0.0 (matching ianmacd's TWRP build toolchain)
      run: |
        set -eux
        cd ${{ github.workspace }}
        curl -fLsS https://github.com/llvm/llvm-project/releases/download/llvmorg-10.0.0/clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz \
          -o clang10.tar.xz
        tar -xJf clang10.tar.xz
        mv clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04 clang10
        rm clang10.tar.xz
        ls clang10/bin/clang
        ./clang10/bin/clang --version | head -1
    - name: Build packages in the container
      run: |
        docker run -u root \
        -v ${{ github.workspace }}:/build/sources -v /tmp/results:/build \
        quay.io/droidian/build-essential:next-amd64 /bin/bash -c '''
        ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        cd /build/sources
        RELENG_HOST_ARCH="arm64" releng-build-package
        '''
    - uses: actions/upload-artifact@v4
      with:
        path: /tmp/results
    - name: Get version
      run: echo "version=$(head -n1 debian/changelog | cut -d '(' -f2 | cut -d ')' -f1 | sed 's/+/-/g')" >> $GITHUB_ENV
    - name: Create latest release
      uses: softprops/action-gh-release@v2.2.2
      with:
        files: /tmp/results/*
        tag_name: ${{ env.version }}
        draft: false
    - name: Generate flat apt repo metadata (Packages.gz + Release)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends apt-utils
        cd /tmp/results
        sudo chown -R $(whoami) .
        # Strip the 'sources' subdir releng-build-package leaves behind
        rmdir sources 2>/dev/null || true
        # Flat-format: Packages and Release at the URL root so droidian-recipes
        # can use 'deb [trusted=yes] <url>/ ./'.
        apt-ftparchive packages . > Packages
        gzip -9c Packages > Packages.gz
        cat > apt-ftparchive.conf <<'EOF'
        APT::FTPArchive::Release::Origin "mukahraman/kernel_samsung_sm8250";
        APT::FTPArchive::Release::Label  "mukahraman/kernel_samsung_sm8250";
        APT::FTPArchive::Release::Suite  "trixie";
        APT::FTPArchive::Release::Codename "trixie";
        APT::FTPArchive::Release::Architectures "arm64";
        APT::FTPArchive::Release::Components "main";
        EOF
        apt-ftparchive -c apt-ftparchive.conf release . > Release

    - name: Generate Pages index.html
      run: |
        cd /tmp/results
        ls -1 > files

        # Generate index.html
        # Get the current working directory
        dir=$(pwd)

        # Create an index.html file
        echo '<!DOCTYPE html><html><head><title>Index</title></head><body>' > index.html

        # Loop through all files in the directory
        for file in *; do
            # Check if the file is not the index.html file itself
            if [ $file != "index.html" ]; then
                # Add a link to the file in the index.html file
                echo "<a href=\"$file\">$file</a><br>" >> index.html
            fi
        done

        # Close the HTML tags
        echo "</body></html>" >> index.html
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: /tmp/results
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
